name: Release

# Push a tag like v1.2.0 and this builds a signed APK and publishes it as a GitHub Release.
# Installed copies of the app find it within a day (or right away via Settings → Updates).
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Signing secrets are missing. Run scripts/upload-signing-secrets.sh once (see RELEASING.md)."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > forge-release.jks
          printf 'storeFile=forge-release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > keystore.properties

      - name: Test and build the signed APK
        run: |
          chmod +x gradlew
          VERSION="${GITHUB_REF_NAME#v}"
          ./gradlew testDebugUnitTest assembleRelease \
            -PforgeVersion="$VERSION" -PforgeRepo="$GITHUB_REPOSITORY" --no-daemon
          cp app/build/outputs/apk/release/app-release.apk "Forge-$VERSION.apk"

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          files: Forge-*.apk
          generate_release_notes: true
          body_path: ${{ hashFiles('release-notes.md') != '' && 'release-notes.md' || '' }}

      - name: Remove the key from the runner
        if: always()
        run: rm -f forge-release.jks keystore.properties
