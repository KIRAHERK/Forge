name: Release

# Builds a signed APK and publishes it as a GitHub Release. Two ways to start it:
#  - push a tag like v1.2.0 (scripts/release.sh), or
#  - Actions tab -> Release -> Run workflow, and type the version. This works from a
#    phone or a cloud session that can't push tags; the tag is created for you.
# Installed copies of the app find it within a day (or right away via Settings → Updates).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, like 1.4.0 (must be newer than the last one)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Work out the version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            v="${INPUT_VERSION#v}"
            if ! [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Version must look like 1.4.0"; exit 1
            fi
            if git rev-parse "v$v" >/dev/null 2>&1; then
              echo "::error::v$v already exists."; exit 1
            fi
            latest="$(git tag --list 'v*' --sort=-v:refname | head -1)"
            if [ -n "$latest" ] && [ "$(printf '%s\n%s\n' "${latest#v}" "$v" | sort -V | tail -1)" != "$v" ]; then
              echo "::error::v$v must be newer than $latest, or phones won't update."; exit 1
            fi
          else
            v="${GITHUB_REF_NAME#v}"
          fi
          echo "VERSION=$v" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Signing secrets are missing. Run scripts/upload-signing-secrets.sh once (see RELEASING.md)."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > forge-release.jks
          printf 'storeFile=forge-release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > keystore.properties

      - name: Test and build the signed APK
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleRelease \
            -PforgeVersion="$VERSION" -PforgeRepo="$GITHUB_REPOSITORY" --no-daemon
          cp app/build/outputs/apk/release/app-release.apk "Forge-$VERSION.apk"
          # Same file under a fixed name, so releases/latest/download/Forge.apk always gets the newest.
          cp "Forge-$VERSION.apk" Forge.apk

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Forge-*.apk
            Forge.apk
          tag_name: v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          body_path: ${{ hashFiles('release-notes.md') != '' && 'release-notes.md' || '' }}

      - name: Remove the key from the runner
        if: always()
        run: rm -f forge-release.jks keystore.properties
